<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pantry Pal</title>
    <meta
      name="description"
      content="Scan your groceries, track expiration dates and get alerts with recipe ideas before food goes to waste."
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pantry Pal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <span id="top-back"></span>
      <h1 id="title">Pantry Pal</h1>
      <div id="top-actions"></div>
    </header>
    <main id="view" tabindex="-1">
      <noscript><p class="empty">Pantry Pal needs JavaScript turned on.</p></noscript>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div id="toasts" aria-live="polite"></div>
  </body>
</html>
